# Germans Quellen. Geprüft am 2026-10-07.
# Am einfachsten in der App bearbeiten: jobscout app -d .  → Seite 'Sources'.
# Lehrstuhlseiten → type: llm_page.

defaults:
  # gilt für jede Quelle ohne eigenen focus – in der App unter 'Sources' editierbar
  focus: >-
    PhD / doctoral positions (also research assistant roles) in chemical or process engineering
    that combine engineering with machine learning, data science or optimisation: ML/AI for process
    design and flowsheet synthesis, hybrid (physics + ML) models, heat/process integration, membrane
    and separation processes, process intensification, process systems engineering, Power-to-X /
    defossilisation modelling, techno-economic and life-cycle assessment, technology & society
    research on the chemical industry. Exclude postdoc, professor and pure lab-synthesis roles.

sources:
  # ---------- Stellenbörsen / Aggregatoren ----------
  - name: AcademicPositions – neueste PhD-Stellen (Europa)
    type: llm_page
    url: https://academicpositions.com/jobs/position/phd
    extra_urls:
      - https://academicpositions.com/jobs/position/phd?page=2
      - https://academicpositions.com/jobs/position/phd?page=3
      - https://academicpositions.com/jobs/position/phd?page=4

  - name: AcademicTransfer (NL) – process engineering
    type: llm_page
    url: https://www.academictransfer.com/en/jobs/?q=process+engineering

  - name: AcademicTransfer (NL) – machine learning chemical
    type: llm_page
    url: https://www.academictransfer.com/en/jobs/?q=machine+learning+chemical

  - name: AcademicTransfer (NL) – membrane
    type: llm_page
    url: https://www.academictransfer.com/en/jobs/?q=membrane

  - name: ETH Zürich – Jobportal
    type: llm_page
    url: https://jobs.ethz.ch/
    organization: ETH Zürich

  # EURAXESS (inkl. MSCA Doctoral Networks). Die Filter-URL bitte im Browser erzeugen
  # (Research Field: Engineering · Researcher Profile: First Stage Researcher (R1) ·
  # ggf. Funding Programme: MSCA) und hier einsetzen – Filter ließen sich von hier aus nicht prüfen.
  - name: EURAXESS – R1 (PhD)
    type: llm_page
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_profile%3A447
    extra_urls:
      - https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_profile%3A447&page=1
      - https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_profile%3A447&page=2

  # ---------- Lehrstühle ----------
  - name: TU Delft – Process Intelligence Research (Schweidtmann)
    type: llm_page
    url: https://www.pi-research.org/open_positions/
    organization: TU Delft – Process Intelligence Research (Artur Schweidtmann)
    fetch_details: true

